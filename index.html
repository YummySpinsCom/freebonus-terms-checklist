<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Casino Bonus Terms Checklist</title>

  <meta
    name="description"
    content="A simple checklist for reviewing important online casino bonus terms before claiming an offer."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Casino Bonus Terms Checklist</h1>

    <p>
      Review the most important conditions of an online casino bonus before claiming it.
    </p>

    <div class="checklist">

      <label>
        <input type="checkbox" class="term-check">
        Wagering requirement checked
      </label>

      <label>
        <input type="checkbox" class="term-check">
        Minimum deposit checked
      </label>

      <label>
        <input type="checkbox" class="term-check">
        Maximum bet limit checked
      </label>

      <label>
        <input type="checkbox" class="term-check">
        Eligible games checked
      </label>

      <label>
        <input type="checkbox" class="term-check">
        Bonus expiry date checked
      </label>

      <label>
        <input type="checkbox" class="term-check">
        Withdrawal restrictions checked
      </label>

      <label>
        <input type="checkbox" class="term-check">
        Country restrictions checked
      </label>

    </div>

    <div class="progress" id="progress">
      0 of 7 bonus terms checked
    </div>

    <button type="button" onclick="resetChecklist()">
      Reset checklist
    </button>

    <p class="note">
      This checklist is provided for informational purposes only.
      Bonus terms vary between casino operators and promotions.
    </p>

  </div>

  <script src="script.js"></script>

</body>
</html>
